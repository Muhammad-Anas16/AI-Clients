[package]
name = "tauri-app"
version = "0.1.0"
description = "JARVIS Tauri Desktop Client"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["multipart"] }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

cpal = "0.16"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
