<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>JARVIS Master Server</title><style>body{font-family:Arial,sans-serif;max-width:980px;margin:24px auto;padding:0 14px;background:#101318;color:#eee}section{background:#181d24;padding:16px;border-radius:12px;margin:12px 0}button,input{padding:10px;margin:4px;border-radius:8px;border:1px solid #3b4350;background:#0f1318;color:#fff}pre{white-space:pre-wrap;background:#0d1014;padding:12px;border-radius:8px;min-height:80px}.bar{height:18px;background:#2b313b;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#49d17d}.small{opacity:.75;font-size:13px}</style></head><body>
<h1>JARVIS Master Server</h1><p class="small">Node/Express · node-llama-cpp · Tesseract.js · Python Vosk/Piper WebSocket workers</p>
<section><h2>Connection</h2><pre id="connection">Connecting...</pre></section>
<section><h2>Install / Models</h2><pre id="models">Loading...</pre><div class="bar"><div id="fill" class="fill"></div></div><pre id="download">No active downloads.</pre></section>
<section><h2>Think</h2><input id="message" size="50" value="Hello JARVIS"><button id="chat">Ask LLaMA</button><pre id="chatout"></pre></section>
<section><h2>Speak</h2><input id="speech" size="50" value="Hello, I am JARVIS."><button id="speak">Generate TTS</button><audio id="audio" controls></audio><pre id="speakout"></pre></section>
<section><h2>See / OCR</h2><input id="image" type="file" accept="image/*"><button id="ocr">Read Image</button><pre id="ocrout"></pre></section>
<script>
const state={ws:null};function log(id,text){document.getElementById(id).textContent=text}function connect(){const protocol=location.protocol==='https:'?'wss':'ws';state.ws=new WebSocket(`${protocol}://${location.host}/ws/jarvis`);state.ws.onopen=()=>log('connection','WebSocket connected.');state.ws.onclose=()=>{log('connection','Disconnected. Retrying...');setTimeout(connect,1500)};state.ws.onerror=()=>log('connection','WebSocket error.');state.ws.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==='ready')log('connection','WebSocket ready. Pipeline: '+data.pipeline.join(' → '));if(data.type==='chat.result')log('chatout',data.text);if(data.type==='speak.result'){document.getElementById('audio').src='data:'+data.mime+';base64,'+data.audio;log('speakout','TTS ready.')}if(data.type==='ocr.result')log('ocrout',data.text);if(data.type==='error')log('connection',data.code+' '+(data.message||''))}}connect();async function refreshModels(){const r=await fetch('/api/models');log('models',JSON.stringify(await r.json(),null,2))}refreshModels();const events=new EventSource('/api/downloads/events');events.onmessage=e=>{const d=JSON.parse(e.data);document.getElementById('fill').style.width=(d.percent||0)+'%';log('download',JSON.stringify(d,null,2));refreshModels()};document.getElementById('chat').onclick=()=>state.ws.send(JSON.stringify({type:'chat',message:document.getElementById('message').value}));document.getElementById('speak').onclick=()=>state.ws.send(JSON.stringify({type:'speak',text:document.getElementById('speech').value,language:'en-us'}));document.getElementById('ocr').onclick=async()=>{const f=document.getElementById('image').files[0];if(!f)return;const b=await f.arrayBuffer();let bin='';const bytes=new Uint8Array(b);for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);state.ws.send(JSON.stringify({type:'ocr',imageBase64:btoa(bin),language:'eng'}))};
</script></body></html>
